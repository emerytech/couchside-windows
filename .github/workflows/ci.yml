name: CI

# Syntax gate for the Windows agent. py_compile is import-free, so it validates
# couchsided-win.py + qr.py on ubuntu without any Windows-only dependency
# (ctypes/ViGEmClient.dll are loaded at runtime, not import time). A real
# windows-latest build/import + a PyInstaller smoke are a future add.

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  compile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: py_compile the Windows agent
        run: |
          python3 -m py_compile couchsided-win.py qr.py
          echo "py_compile OK"

  transport:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - run: 'python -m pip install --only-binary=:all: cryptography==46.0.7'
      - run: python tests/test_https_upload.py -q
      - run: python tests/test_update_apply.py -q
      - run: python tests/test_update_supervisor.py -q
      - name: Installer consent preservation (Windows PowerShell 5.1)
        if: runner.os == 'Windows'
        run: powershell -NoProfile -ExecutionPolicy Bypass -File tests/test_installer_consent.ps1 -Source install.ps1
