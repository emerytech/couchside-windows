name: Release installer

# Dormant until the owner separately approves SignPath and sets SIGNPATH_RELEASE_ENABLED.
# On a v* tag: build couchside-agent.exe and CouchsideSetup.exe on a
# GitHub-hosted windows-latest runner, have both SIGNED through SignPath
# (SignPath Foundation certificate, free OSS programme), and attach the signed
# installer to a DRAFT GitHub release. Publishing the draft stays a manual step.
#
# Order matters: the agent exe is embedded inside the Inno installer, so it is
# signed FIRST, the signed exe is compiled into the installer, and only then is
# CouchsideSetup.exe itself signed.
#
# Manual approval, twice over:
#   1. GitHub environment "signpath-release" (create it in repo Settings ->
#      Environments; add a required reviewer and restrict it to v* tags). The
#      job does not start, and cannot read the SignPath token, until approved.
#   2. The SignPath signing policy requires a manual approval for every signing
#      request (SignPath Foundation condition). wait-for-completion keeps the job
#      parked until the approver acts in SignPath or the timeout expires.
#
# Secrets/variables are referenced by NAME only -- values live in GitHub
# (environment "signpath-release"), never in this file:
#   secrets.SIGNPATH_API_TOKEN               CI submitter token (SignPath)
#   vars.SIGNPATH_ORGANIZATION_ID
#   vars.SIGNPATH_PROJECT_SLUG
#   vars.SIGNPATH_SIGNING_POLICY_SLUG        release-signing policy
#   vars.SIGNPATH_AGENT_ARTIFACT_CONFIG      artifact config for couchside-agent.exe
#   vars.SIGNPATH_SETUP_ARTIFACT_CONFIG      artifact config for CouchsideSetup.exe
#
# Runs only in emerytech/couchside-windows (public, MIT). Never point this at
# the monorepo or any private repository.

on:
  push:
    tags: ["v*"]

# Default-deny; each job opts into the minimum it needs.
permissions: {}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-and-sign:
    if: github.repository == 'emerytech/couchside-windows' && vars.SIGNPATH_RELEASE_ENABLED == 'true'
    # GitHub-hosted only: SignPath's OSS build-origin verification requires it.
    runs-on: windows-latest
    environment: signpath-release
    permissions:
      contents: read   # checkout
      actions: read    # SignPath downloads the uploaded artifact via the run's token
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      # build.ps1 hard-errors without the DLL (issue #255).
      - uses: ./.github/actions/fetch-vigem

      - name: Derive agent version (and check it matches the tag)
        id: ver
        shell: pwsh
        run: |
          $m = Select-String -Path couchsided-win.py -Pattern 'VERSION\s*=\s*["'']([^"'']+)["'']' | Select-Object -First 1
          $v = $m.Matches[0].Groups[1].Value
          if ("v$v" -ne $env:GITHUB_REF_NAME) { throw "tag $($env:GITHUB_REF_NAME) does not match agent VERSION $v" }
          if ($v -notmatch '^(\d+)\.(\d+)\.(\d+)-win$') { throw "VERSION $v is not a.b.c[-suffix]" }
          $num = "$($matches[1]).$($matches[2]).$($matches[3]).0"
          "version=$v"  >> $env:GITHUB_OUTPUT
          "numver=$num" >> $env:GITHUB_OUTPUT
          $t = ($num -split '\.') -join ', '
          # PyInstaller version resource: ProductName "Couchside" and the same
          # ProductVersion as the installer (SignPath metadata restrictions).
          @"
          VSVersionInfo(
            ffi=FixedFileInfo(filevers=($t), prodvers=($t), mask=0x3f, flags=0x0,
                              OS=0x40004, fileType=0x1, subtype=0x0, date=(0, 0)),
            kids=[
              StringFileInfo([StringTable('040904B0', [
                StringStruct('CompanyName', 'ETS3D LLC'),
                StringStruct('FileDescription', 'Couchside Windows agent'),
                StringStruct('FileVersion', '$num'),
                StringStruct('InternalName', 'couchside-agent'),
                StringStruct('LegalCopyright', 'Copyright (c) 2026 Taylor Emery (ETS3D LLC). MIT License.'),
                StringStruct('OriginalFilename', 'couchside-agent.exe'),
                StringStruct('ProductName', 'Couchside'),
                StringStruct('ProductVersion', '$num')])]),
              VarFileInfo([VarStruct('Translation', [1033, 1200])])
            ]
          )
          "@ | Set-Content -Encoding utf8 -Path (Join-Path $env:RUNNER_TEMP 'version_info.txt')

      - name: Build couchside-agent.exe (PyInstaller)
        run: powershell -NoProfile -ExecutionPolicy Bypass -File build.ps1 -VersionFile "$env:RUNNER_TEMP\version_info.txt"

      # ---- sign the agent exe ------------------------------------------------
      - name: Upload unsigned agent for SignPath
        id: upload-agent
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: unsigned-agent
          path: dist/couchside-agent.exe
          if-no-files-found: error
          retention-days: 7

      - name: Sign couchside-agent.exe (SignPath, manual approval)
        uses: signpath/github-action-submit-signing-request@f6d04783b4569d051e0c80105fe66e82819d0092 # v3
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG }}
          artifact-configuration-slug: ${{ vars.SIGNPATH_AGENT_ARTIFACT_CONFIG }}
          github-artifact-id: ${{ steps.upload-agent.outputs.artifact-id }}
          wait-for-completion: true
          wait-for-completion-timeout-in-seconds: 7200
          output-artifact-directory: signed/agent

      - name: Use the signed agent for the installer
        shell: pwsh
        run: |
          $signed = 'signed/agent/couchside-agent.exe'
          $sig = Get-AuthenticodeSignature $signed
          if ($sig.Status -ne 'Valid') { throw "signed agent signature status: $($sig.Status)" }
          if ($sig.SignerCertificate.Subject -notmatch '(^|,\s*)CN="?SignPath Foundation"?\s*(,|$)') { throw 'Unexpected signer' }
          if (-not $sig.TimeStamperCertificate) { throw 'Missing timestamp' }
          $file = if (Test-Path 'signed/setup/CouchsideSetup.exe') { 'signed/setup/CouchsideSetup.exe' } else { 'signed/agent/couchside-agent.exe' }
          $info = (Get-Item $file).VersionInfo
          if ($info.ProductName.Trim() -ne 'Couchside' -or $info.ProductVersion.Trim() -ne '${{ steps.ver.outputs.numver }}') { throw 'Signed binary product/version mismatch' }
          $sig.SignerCertificate | Format-List Subject, NotAfter
          Copy-Item $signed dist/couchside-agent.exe -Force

      # ---- build + sign the installer ----------------------------------------
      - name: Install verified Inno Setup
        run: |
          $iscc = & ./tools/install-inno.ps1
          "COUCHSIDE_ISCC=$iscc" >> $env:GITHUB_ENV

      - name: Compile CouchsideSetup.exe
        run: |
          & $env:COUCHSIDE_ISCC `
            /DMyAppVersion=${{ steps.ver.outputs.version }} `
            /DMyAppNumVersion=${{ steps.ver.outputs.numver }} `
            installer\couchside.iss
          if ($LASTEXITCODE -ne 0) { throw "ISCC failed with exit code $LASTEXITCODE" }

      - name: Upload unsigned installer for SignPath
        id: upload-setup
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: unsigned-setup
          path: dist/CouchsideSetup.exe
          if-no-files-found: error
          retention-days: 7

      - name: Sign CouchsideSetup.exe (SignPath, manual approval)
        uses: signpath/github-action-submit-signing-request@f6d04783b4569d051e0c80105fe66e82819d0092 # v3
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG }}
          artifact-configuration-slug: ${{ vars.SIGNPATH_SETUP_ARTIFACT_CONFIG }}
          github-artifact-id: ${{ steps.upload-setup.outputs.artifact-id }}
          wait-for-completion: true
          wait-for-completion-timeout-in-seconds: 7200
          output-artifact-directory: signed/setup

      - name: Verify installer signature
        shell: pwsh
        run: |
          $sig = Get-AuthenticodeSignature signed/setup/CouchsideSetup.exe
          if ($sig.Status -ne 'Valid') { throw "signed installer signature status: $($sig.Status)" }
          # The agent's in-app updater requires exactly this (see update_apply).
          if ($sig.SignerCertificate.Subject -notmatch 'CN="?SignPath Foundation') { throw "unexpected signer: $($sig.SignerCertificate.Subject)" }
          if (-not $sig.TimeStamperCertificate) { throw 'installer signature has no timestamp' }
          if ($sig.SignerCertificate.Subject -notmatch '(^|,\s*)CN="?SignPath Foundation"?\s*(,|$)') { throw 'Unexpected signer' }
          if (-not $sig.TimeStamperCertificate) { throw 'Missing timestamp' }
          $file = if (Test-Path 'signed/setup/CouchsideSetup.exe') { 'signed/setup/CouchsideSetup.exe' } else { 'signed/agent/couchside-agent.exe' }
          $info = (Get-Item $file).VersionInfo
          if ($info.ProductName.Trim() -ne 'Couchside' -or $info.ProductVersion.Trim() -ne '${{ steps.ver.outputs.numver }}') { throw 'Signed binary product/version mismatch' }
          $sig.SignerCertificate | Format-List Subject, NotAfter

      - name: Keep the signed installer for the release job
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: CouchsideSetup-signed
          path: |
            signed/setup/CouchsideSetup.exe
            signed/agent/couchside-agent.exe
          if-no-files-found: error

  # Separate job so the only token with contents:write never sees the SignPath
  # secret and never runs the build.
  attach-draft:
    needs: build-and-sign
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: CouchsideSetup-signed
          path: dist
      # Published checksum: the agent's in-app updater refuses an installer
      # whose SHA256 does not match this file (sha256sum format).
      - name: Write CouchsideSetup.exe.sha256
        run: |
          set -euo pipefail
          cp dist/setup/CouchsideSetup.exe dist/CouchsideSetup.exe
          cp dist/agent/couchside-agent.exe dist/couchside-agent.exe
          cd dist
          sha256sum CouchsideSetup.exe > CouchsideSetup.exe.sha256
          sha256sum CouchsideSetup.exe couchside-agent.exe > SHA256SUMS
          cat CouchsideSetup.exe.sha256
      - name: Attach signed installer to a DRAFT release (publish manually)
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          draft: true
          files: |
            dist/CouchsideSetup.exe
            dist/CouchsideSetup.exe.sha256
            dist/couchside-agent.exe
            dist/SHA256SUMS
          fail_on_unmatched_files: true
