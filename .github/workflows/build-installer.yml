name: Build installer

# Build the double-click CouchsideSetup.exe on windows-latest:
#   PyInstaller (build.ps1) -> couchside-agent.exe  ->  Inno Setup -> CouchsideSetup.exe
# This is the artifact SignPath will sign (a later step) and that couchside.tv
# will hand mainstream Windows users instead of `irm ... | iex`.

on:
  workflow_dispatch:
  push:
    paths:
      - couchsided-win.py
      - qr.py
      - build.ps1
      - install.ps1
      - installer/**
      - .github/workflows/build-installer.yml

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # build.ps1 REQUIRES ViGEmClient.dll and hard-errors without it, on purpose:
      # an agent built without it reports caps.gamepad=false and the phone app
      # hides the Pad tab entirely (issue #255). The DLL is .gitignore'd here and
      # is never committed, so CI has to fetch it -- the same official
      # redistributable copy install.ps1 pulls, out of the vgamepad PyPI sdist.
      # Hard-fail: an installer that silently ships without a working pad is the
      # exact bug we are fixing, so it must never reach the artifact.
      - name: Fetch ViGEmClient.dll (required by build.ps1)
        shell: pwsh
        run: |
          $tmp = Join-Path $env:TEMP 'vigem'
          New-Item -ItemType Directory -Force -Path $tmp | Out-Null
          $meta  = Invoke-RestMethod -Uri 'https://pypi.org/pypi/vgamepad/json' -TimeoutSec 20
          $sdist = ($meta.urls | Where-Object { $_.packagetype -eq 'sdist' } | Select-Object -First 1).url
          if (-not $sdist) { throw 'no vgamepad sdist on PyPI' }
          $tgz = Join-Path $tmp 'vgamepad.tar.gz'
          Invoke-WebRequest -Uri $sdist -OutFile $tgz -TimeoutSec 60 -UseBasicParsing
          & tar.exe -xzf $tgz -C $tmp
          $hit = Get-ChildItem $tmp -Recurse -Filter 'ViGEmClient.dll' |
                 Where-Object { $_.FullName -match '\\x64\\' } | Select-Object -First 1
          if (-not $hit) { throw 'ViGEmClient.dll (x64) not found in the vgamepad sdist' }
          Copy-Item $hit.FullName (Join-Path $PWD 'ViGEmClient.dll') -Force
          Get-Item ViGEmClient.dll | Format-List Name, Length

      - name: Build couchside-agent.exe (PyInstaller)
        run: powershell -NoProfile -ExecutionPolicy Bypass -File build.ps1

      - name: Derive agent version from couchsided-win.py
        id: ver
        shell: pwsh
        run: |
          $m = Select-String -Path couchsided-win.py -Pattern 'VERSION\s*=\s*["'']([^"'']+)["'']' | Select-Object -First 1
          $v = if ($m) { $m.Matches[0].Groups[1].Value } else { "0.0.0" }
          Write-Host "agent version: $v"
          "version=$v" >> $env:GITHUB_OUTPUT

      - name: Install Inno Setup
        run: choco install innosetup -y --no-progress

      - name: Compile CouchsideSetup.exe
        run: |
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" `
            /DMyAppVersion=${{ steps.ver.outputs.version }} `
            installer\couchside.iss

      - name: Sanity — the installer exists
        shell: pwsh
        run: |
          if (-not (Test-Path dist\CouchsideSetup.exe)) { throw "CouchsideSetup.exe was not produced" }
          Get-Item dist\CouchsideSetup.exe | Format-List Name, Length

      - name: Upload CouchsideSetup.exe
        uses: actions/upload-artifact@v4
        with:
          name: CouchsideSetup
          path: dist/CouchsideSetup.exe
          if-no-files-found: error
