name: Build installer

# Build the double-click CouchsideSetup.exe on windows-latest:
#   PyInstaller (build.ps1) -> couchside-agent.exe  ->  Inno Setup -> CouchsideSetup.exe
# This is the artifact SignPath will sign (a later step) and that couchside.tv
# will hand mainstream Windows users instead of `irm ... | iex`.

on:
  workflow_dispatch:
  push:
    paths:
      - couchsided-win.py
      - qr.py
      - build.ps1
      - build-requirements.txt
      - tools/**
      - tests/test_installer_fresh.ps1
      - .github/actions/**
      - install.ps1
      - installer/**
      - .github/workflows/build-installer.yml

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      # See the action for why this is required and why it hard-fails.
      - uses: ./.github/actions/fetch-vigem

      - name: Derive agent version from couchsided-win.py
        id: ver
        shell: pwsh
        run: |
          $m = Select-String -Path couchsided-win.py -Pattern 'VERSION\s*=\s*["'']([^"'']+)["'']' | Select-Object -First 1
          $v = $m.Matches[0].Groups[1].Value
          if ($v -notmatch '^(\d+)\.(\d+)\.(\d+)(?:-rc\d+)?-win$') { throw "VERSION $v is not a.b.c[-suffix]" }
          $num = "$($matches[1]).$($matches[2]).$($matches[3]).0"
          "version=$v"  >> $env:GITHUB_OUTPUT
          "numver=$num" >> $env:GITHUB_OUTPUT
          $t = ($num -split '\.') -join ', '
          # PyInstaller version resource: ProductName "Couchside" and the same
          # ProductVersion as the installer (SignPath metadata restrictions).
          @"
          VSVersionInfo(
            ffi=FixedFileInfo(filevers=($t), prodvers=($t), mask=0x3f, flags=0x0,
                              OS=0x40004, fileType=0x1, subtype=0x0, date=(0, 0)),
            kids=[
              StringFileInfo([StringTable('040904B0', [
                StringStruct('CompanyName', 'ETS3D LLC'),
                StringStruct('FileDescription', 'Couchside Windows agent'),
                StringStruct('FileVersion', '$num'),
                StringStruct('InternalName', 'couchside-agent'),
                StringStruct('LegalCopyright', 'Copyright (c) 2026 Taylor Emery (ETS3D LLC). MIT License.'),
                StringStruct('OriginalFilename', 'couchside-agent.exe'),
                StringStruct('ProductName', 'Couchside'),
                StringStruct('ProductVersion', '$num')])]),
              VarFileInfo([VarStruct('Translation', [1033, 1200])])
            ]
          )
          "@ | Set-Content -Encoding utf8 -Path (Join-Path $env:RUNNER_TEMP 'version_info.txt')

      - name: Build couchside-agent.exe (PyInstaller)
        run: powershell -NoProfile -ExecutionPolicy Bypass -File build.ps1 -VersionFile "$env:RUNNER_TEMP\version_info.txt"

      - name: Install verified Inno Setup
        run: |
          $iscc = & ./tools/install-inno.ps1
          "COUCHSIDE_ISCC=$iscc" >> $env:GITHUB_ENV

      - name: Compile CouchsideSetup.exe
        run: |
          & $env:COUCHSIDE_ISCC `
            /DMyAppVersion=${{ steps.ver.outputs.version }} `
            /DMyAppNumVersion=${{ steps.ver.outputs.numver }} `
            installer\couchside.iss
          if ($LASTEXITCODE -ne 0) { throw "ISCC failed: $LASTEXITCODE" }

      - name: Verify unsigned candidate metadata and checksums
        shell: pwsh
        run: |
          $lines = foreach ($file in @('dist/couchside-agent.exe', 'dist/CouchsideSetup.exe')) {
            $info = (Get-Item $file).VersionInfo
            if ($info.ProductName.Trim() -ne 'Couchside' -or $info.ProductVersion.Trim() -ne '${{ steps.ver.outputs.numver }}') {
              throw "Candidate metadata mismatch: $file"
            }
            if ((Get-AuthenticodeSignature $file).Status -ne 'NotSigned') { throw "Preview unexpectedly signed: $file" }
            ((Get-FileHash -Algorithm SHA256 $file).Hash.ToLower() + '  ' + (Split-Path $file -Leaf))
          }
          $lines | Set-Content -Encoding ascii dist/SHA256SUMS
          $lines

      - name: Fresh install and silent upgrade on disposable runner
        timeout-minutes: 12
        run: powershell -NoProfile -ExecutionPolicy Bypass -File tests/test_installer_fresh.ps1 -Setup dist/CouchsideSetup.exe

      - name: Upload CouchsideSetup.exe
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: CouchsideSetup
          path: |
            dist/CouchsideSetup.exe
            dist/SHA256SUMS
          if-no-files-found: error

      # Also retain the exact inner executable for in-place preview testing.
      # This is a workflow artifact, not a release or installer behavior change.
      - name: Upload standalone preview agent
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: CouchsideAgentPreview
          path: dist/couchside-agent.exe
          if-no-files-found: error
